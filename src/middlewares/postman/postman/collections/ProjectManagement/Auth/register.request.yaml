$kind: http-request
url: '{{baseUrl}}/api/v1/auth/register'
method: POST
order: 1000
body:
  type: json
  content: |-
    {
        "email": "user@gmail.com",
        "username": "abc123",
        "password": "user@12345",
        "role": "user"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.verificationToken) {
          pm.environment.set('verificationToken', json.data.verificationToken);
          console.log('verificationToken saved:', json.data.verificationToken);
      }
